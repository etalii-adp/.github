# Checks every pull request into develop (etalii.adp spec 002, FR-017): a pull request that reintroduces a retired use
# of the ADP vocabulary fails. The runner and its list of retired patterns and allowances live in etalii.adp and are
# read from its develop branch, so every repository is checked against the same list.
name: Build

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terminology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check the vocabulary against the glossary
        env:
          SOURCE: https://raw.githubusercontent.com/etalii-adp/etalii.adp/develop
        run: |
          curl -fsSL "$SOURCE/.github/scripts/terminology-check.py" -o "$RUNNER_TEMP/terminology-check.py"
          python "$RUNNER_TEMP/terminology-check.py" --name "${{ github.event.repository.name }}" --config "$SOURCE/docs/terminology-check.json"
